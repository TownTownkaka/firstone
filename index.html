<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<title>StepFlow 網頁計步器</title>
<style>
:root{--blue:#2563eb;--cyan:#06b6d4;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--shadow:0 10px 30px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans HK",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.wrap{max-width:1120px;margin:auto;padding:0 20px}.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.bar{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 8px 20px rgba(37,99,235,.25)}h1,h2,h3,p{margin:0}.brand h1{font-size:18px}.brand p{font-size:12px;color:var(--muted);margin-top:2px}.settings{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}.hero{padding:34px 0 24px;display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{color:var(--blue);font-size:13px;font-weight:800}.hero h2{font-size:32px;margin-top:5px}.hero p{color:var(--muted);font-size:14px;margin-top:9px}.date{color:var(--muted);font-size:14px;font-weight:600}.grid{display:grid;grid-template-columns:.95fr 1.35fr;gap:24px}.card{background:var(--card);border:1px solid rgba(255,255,255,.8);border-radius:26px;box-shadow:var(--shadow)}.maincard{overflow:hidden}.counter{padding:32px;display:flex;flex-direction:column;align-items:center}.ring{width:232px;height:232px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) 0%,var(--cyan) var(--p),#e2e8f0 var(--p));position:relative}.ring:after{content:"";position:absolute;inset:15px;background:#fff;border-radius:50%}.inside{position:relative;z-index:1;text-align:center}.feet{font-size:27px}.steps{font-size:40px;font-weight:900;letter-spacing:-1px}.goal{color:var(--muted);font-size:14px;font-weight:600}.pill{margin-top:12px;display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800}.remaining{margin-top:20px;color:var(--muted);font-size:14px}.primary{margin-top:22px;width:100%;border:0;border-radius:15px;padding:14px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 22px rgba(37,99,235,.22)}.primary.stop{background:#1e293b}.sensor{margin-top:11px;color:#94a3b8;font-size:12px}.manual{padding:19px;background:#f8fafc;border-top:1px solid #f1f5f9}.manual-head{display:flex;justify-content:space-between;margin-bottom:12px;font-size:14px;font-weight:800}.reset{border:0;background:none;color:#94a3b8;font-size:12px;font-weight:700;cursor:pointer}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.buttons button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;font-weight:800;cursor:pointer}.right{display:flex;flex-direction:column;gap:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:19px}.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#ecfeff;margin-bottom:14px}.stat:nth-child(2) .icon{background:#fff7ed}.stat:nth-child(3) .icon{background:#f5f3ff}.label{color:var(--muted);font-size:13px}.value{margin-top:5px;font-size:23px;font-weight:900}.unit{font-size:12px;color:#94a3b8}.chart{padding:24px}.chart-head{display:flex;justify-content:space-between}.chart h3{font-size:21px;margin-top:4px}.bars{height:230px;margin-top:26px;display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding:0 6px}.baritem{flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}.barfill{min-height:3px;border-radius:10px 10px 3px 3px;background:linear-gradient(#2563eb,#60a5fa);transition:.5s}.day{font-size:12px;color:var(--muted);font-weight:700;padding-bottom:9px}.tip{margin:22px 0 40px;padding:20px;display:flex;align-items:center;gap:15px;background:linear-gradient(90deg,#eff6ff,#ecfeff);border:1px solid #dbeafe}.tipicon{width:48px;height:48px;border-radius:15px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:22px}.tip p{color:var(--muted);font-size:14px;margin-top:4px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;place-items:center;padding:20px;z-index:20}.modal.open{display:grid}.dialog{width:min(430px,100%);background:#fff;border-radius:24px;padding:25px;box-shadow:0 25px 60px rgba(0,0,0,.2)}.dialog h3{font-size:23px}.dialog label{display:block;margin-top:22px;font-size:14px;font-weight:800}.dialog input{width:100%;margin-top:8px;padding:13px;border:1px solid var(--line);border-radius:13px;font-weight:800;outline:none}.dialog input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #dbeafe}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1;border-radius:13px;padding:12px;font-weight:800;cursor:pointer}.cancel{border:1px solid var(--line);background:#fff}.save{border:0;background:var(--blue);color:#fff}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.hero{align-items:start;flex-direction:column}.hero h2{font-size:28px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.stat:last-child{grid-column:span 2}.bars{height:190px}.wrap{padding:0 15px}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><div class="brand"><div class="logo">👣</div><div><h1>StepFlow</h1><p>每日步行，健康同行</p></div></div><button class="settings" id="settings">⚙️ 設定</button></div></header>
<main class="wrap">
<section class="hero"><div><div class="eyebrow">今日概覽</div><h2>繼續向目標前進</h2><p>每一步都算數。進度會自動儲存在此瀏覽器。</p></div><div class="date" id="date"></div></section>
<div class="grid">
<section class="card maincard"><div class="counter"><div class="ring" id="ring"><div class="inside"><div class="feet">👣</div><div class="steps" id="steps">0</div><div class="goal">步 / <span id="goalText">10,000</span></div><div class="pill" id="pct">0% 完成</div></div></div><div class="remaining" id="remaining"></div><button class="primary" id="track">▶ 啟用動作感應並開始</button><div class="sensor" id="sensor">📱 尚未啟用動作感應器</div></div><div class="manual"><div class="manual-head"><span>手動調整</span><button class="reset" id="reset">↻ 重設</button></div><div class="buttons"><button data-add="-100">−100</button><button data-add="100">+100</button><button data-add="500">+500</button><button data-add="1000">+1,000</button></div></div></section>
<div class="right"><section class="stats"><div class="card stat"><div class="icon">📍</div><div class="label">步行距離</div><div class="value"><span id="distance">0</span> <span class="unit">公里</span></div></div><div class="card stat"><div class="icon">🔥</div><div class="label">消耗熱量</div><div class="value"><span id="calories">0</span> <span class="unit">千卡</span></div></div><div class="card stat"><div class="icon">⏱</div><div class="label">活躍時間</div><div class="value"><span id="minutes">0</span> <span class="unit">分鐘</span></div></div></section><section class="card chart"><div class="chart-head"><div><div class="eyebrow">本週趨勢</div><h3>每日步數</h3></div><div class="pill">最近 7 日</div></div><div class="bars" id="bars"></div></section></div>
</div>
<section class="card tip"><div class="tipicon">✨</div><div><h3>今日小提示</h3><p>午飯後散步 10 分鐘，輕鬆增加約 1,000 步。</p></div></section>
</main>
<div class="modal" id="modal"><div class="dialog"><div class="eyebrow">個人設定</div><h3>設定每日步數目標</h3><label for="goalInput">目標步數</label><input id="goalInput" type="number" min="1000" max="100000" step="500"><div class="actions"><button class="cancel" id="cancel">取消</button><button class="save" id="save">儲存</button></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='stepflow-standalone-v2';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const todayKey=new Date().toISOString().slice(0,10);
let steps=(saved.date===todayKey && Number.isFinite(Number(saved.steps)))?Number(saved.steps):0, goal=Number(saved.goal)||10000, tracking=false, lastPeak=0,lastStep=0;
const week=(saved.date===todayKey && Array.isArray(saved.week))?saved.week:[0,0,0,0,0,0,0];
const $=id=>document.getElementById(id), fmt=n=>Math.round(n).toLocaleString('zh-HK');
function persist(){localStorage.setItem(KEY,JSON.stringify({steps,goal,week,date:todayKey}))}
function toast(t){$('toast').textContent='✓ '+t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2100)}
function render(){const p=Math.min(100,Math.round(steps/goal*100));$('steps').textContent=fmt(steps);$('goalText').textContent=fmt(goal);$('pct').textContent=p+'% 完成';$('ring').style.setProperty('--p',p+'%');$('remaining').innerHTML=steps>=goal?'🏆 <b style="color:#059669">今日目標已達成，做得好！</b>':'再走 <b>'+fmt(goal-steps)+'</b> 步便達標';$('distance').textContent=(steps*.00078).toFixed(2);$('calories').textContent=fmt(steps*.04);$('minutes').textContent=fmt(steps/105);renderBars();persist()}
function renderBars(){const data=[...week];data[6]=steps;const max=Math.max(...data,goal,1),days=['一','二','三','四','五','六','日'];$('bars').innerHTML=data.map((v,i)=>'<div class="baritem" title="'+fmt(v)+' 步"><div class="barfill" style="height:'+Math.max(2,v/max*88)+'%"></div><div class="day">'+days[i]+'</div></div>').join('')}
function motion(e){const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;const m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z),now=Date.now();if(m>12.2&&lastPeak<=12.2&&now-lastStep>320){steps++;lastStep=now;render()}lastPeak=m}
$('track').onclick=async()=>{if(tracking){tracking=false;window.removeEventListener('devicemotion',motion);$('track').textContent='▶ 啟用動作感應並開始';$('track').classList.remove('stop');$('sensor').textContent='📱 已暫停追蹤';return}try{if(typeof DeviceMotionEvent==='undefined'){toast('此瀏覽器不支援動作感應，請手動記錄');return}if(typeof DeviceMotionEvent.requestPermission==='function'){const p=await DeviceMotionEvent.requestPermission();if(p!=='granted'){toast('未獲動作感應權限');return}}tracking=true;window.addEventListener('devicemotion',motion);$('track').textContent='■ 暫停追蹤';$('track').classList.add('stop');$('sensor').textContent='📱 正在使用裝置感應器追蹤';toast('動作感應權限已啟用')}catch(e){toast('感應器啟動失敗')}};
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{steps=Math.max(0,steps+Number(b.dataset.add));render()});
$('reset').onclick=()=>{steps=0;tracking=false;window.removeEventListener('devicemotion',motion);$('track').textContent='▶ 啟用動作感應並開始';$('track').classList.remove('stop');render();toast('已重設今日記錄')};
$('settings').onclick=()=>{$('goalInput').value=goal;$('modal').classList.add('open')};$('cancel').onclick=()=> $('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('save').onclick=()=>{goal=Math.min(100000,Math.max(1000,Number($('goalInput').value)||10000));$('modal').classList.remove('open');render();toast('每日目標已更新')};
$('date').textContent=new Intl.DateTimeFormat('zh-HK',{month:'long',day:'numeric',weekday:'long'}).format(new Date());render();
</script>
</body></html>
