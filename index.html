<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb">
<title>StepFlow 智能計步器</title>
<style>
:root{--b:#2563eb;--c:#06b6d4;--bg:#f1f5f9;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans HK",sans-serif}button,input{font:inherit}.wrap{max-width:1050px;margin:auto;padding:0 18px}.top{position:sticky;top:0;z-index:9;background:#fffffff0;border-bottom:1px solid var(--ln);backdrop-filter:blur(14px)}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center}.logo{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--b),var(--c));color:white;font-size:22px}.brand b{font-size:18px}.brand small{display:block;color:var(--mu);margin-top:2px}.ghost{border:1px solid var(--ln);background:white;border-radius:12px;padding:9px 13px;font-weight:750;cursor:pointer}.hero{padding:30px 0 22px;display:flex;justify-content:space-between;align-items:end;gap:15px}.hero h1{font-size:30px;margin:5px 0 7px}.hero p,.date{margin:0;color:var(--mu);font-size:14px}.blue{color:var(--b);font-weight:800;font-size:13px}.grid{display:grid;grid-template-columns:.9fr 1.2fr;gap:22px}.card{background:white;border-radius:25px;box-shadow:0 8px 28px #0f172a0d;border:1px solid #ffffff}.counter{overflow:hidden}.main{padding:30px;display:flex;flex-direction:column;align-items:center}.ring{--p:0%;width:225px;height:225px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--b),var(--c) var(--p),#e2e8f0 var(--p));position:relative}.ring:after{content:"";position:absolute;inset:15px;background:white;border-radius:50%}.inside{z-index:1;text-align:center}.foot{font-size:26px}.num{font-size:40px;font-weight:900}.sub{font-size:13px;color:var(--mu)}.pill{display:inline-block;margin-top:11px;padding:6px 11px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:800}.remain{font-size:14px;color:var(--mu);margin-top:19px}.primary{width:100%;margin-top:21px;padding:14px;border:0;border-radius:15px;background:var(--b);color:white;font-weight:850;cursor:pointer;box-shadow:0 10px 22px #2563eb38}.primary.stop{background:#1e293b}.status{font-size:12px;color:#94a3b8;margin-top:11px;text-align:center}.manual{padding:18px;background:#f8fafc;border-top:1px solid #f1f5f9}.mh{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:11px}.reset{border:0;background:none;color:#94a3b8;font-size:12px;cursor:pointer}.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.btns button{padding:10px 4px;background:white;border:1px solid var(--ln);border-radius:10px;font-weight:800;cursor:pointer}.right{display:flex;flex-direction:column;gap:19px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px}.ico{width:38px;height:38px;border-radius:11px;background:#ecfeff;display:grid;place-items:center;margin-bottom:12px}.stat:nth-child(2) .ico{background:#fff7ed}.stat:nth-child(3) .ico{background:#f5f3ff}.label{font-size:12px;color:var(--mu)}.val{font-size:22px;font-weight:900;margin-top:4px}.unit{font-size:11px;color:#94a3b8}.chart{padding:22px}.ch{display:flex;justify-content:space-between}.ch h2{font-size:20px;margin:4px 0 0}.bars{height:210px;display:flex;align-items:end;gap:10px;margin-top:22px;border-bottom:1px solid var(--ln)}.bi{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;text-align:center;gap:7px}.fill{background:linear-gradient(#2563eb,#60a5fa);border-radius:9px 9px 2px 2px;min-height:2px;transition:.4s}.day{font-size:11px;color:var(--mu);font-weight:700;padding-bottom:8px}.info{margin:20px 0 35px;padding:18px;display:flex;gap:14px;align-items:center}.info .ico{margin:0;background:#eff6ff;font-size:20px;flex:none}.info h3{margin:0 0 4px;font-size:16px}.info p{margin:0;color:var(--mu);font-size:13px;line-height:1.5}.modal{position:fixed;inset:0;background:#0f172a75;display:none;place-items:center;padding:18px;z-index:20}.modal.open{display:grid}.dialog{background:white;border-radius:22px;width:min(420px,100%);padding:24px}.dialog h2{margin:5px 0 20px}.dialog label{font-size:13px;font-weight:800}.dialog input,.dialog select{width:100%;padding:12px;margin:7px 0 15px;border:1px solid var(--ln);border-radius:12px;background:white}.actions{display:flex;gap:9px;margin-top:6px}.actions button{flex:1;padding:12px;border-radius:12px;font-weight:800;cursor:pointer}.cancel{background:white;border:1px solid var(--ln)}.save{background:var(--b);border:0;color:white}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;background:#0f172a;color:white;border-radius:999px;padding:11px 17px;font-size:13px;font-weight:800;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.hero{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.stat:last-child{grid-column:span 2}.hero h1{font-size:27px}.bars{height:180px}}
</style></head>
<body>
<header class="top"><div class="wrap nav"><div class="brand"><div class="logo">👣</div><div><b>StepFlow</b><small>智能防震計步</small></div></div><button id="settings" class="ghost">⚙️ 設定</button></div></header>
<main class="wrap"><section class="hero"><div><div class="blue">今日概覽</div><h1>繼續向目標前進</h1><p>由 0 開始，資料只會儲存在此瀏覽器。</p></div><div id="date" class="date"></div></section>
<div class="grid"><section class="card counter"><div class="main"><div id="ring" class="ring"><div class="inside"><div class="foot">👣</div><div id="steps" class="num">0</div><div class="sub">步 / <span id="goalText">10,000</span></div><div id="pct" class="pill">0% 完成</div></div></div><div id="remain" class="remain"></div><button id="track" class="primary">▶ 啟用動作感應並開始</button><div id="status" class="status">📱 尚未啟用動作感應器</div></div><div class="manual"><div class="mh"><span>手動調整</span><button id="reset" class="reset">↻ 重設</button></div><div class="btns"><button data-add="-100">−100</button><button data-add="100">+100</button><button data-add="500">+500</button><button data-add="1000">+1,000</button></div></div></section>
<div class="right"><section class="stats"><div class="card stat"><div class="ico">📍</div><div class="label">估算距離</div><div class="val"><span id="distance">0</span> <span class="unit">公里</span></div></div><div class="card stat"><div class="ico">🔥</div><div class="label">估算熱量</div><div class="val"><span id="calories">0</span> <span class="unit">千卡</span></div></div><div class="card stat"><div class="ico">⏱</div><div class="label">活躍時間</div><div class="val"><span id="minutes">0</span> <span class="unit">分鐘</span></div></div></section><section class="card chart"><div class="ch"><div><div class="blue">本週趨勢</div><h2>每日步數</h2></div><div class="pill">最近 7 日</div></div><div id="bars" class="bars"></div></section></div></div>
<section class="card info"><div class="ico">🛡️</div><div><h3>智能防誤計</h3><p>系統會先確認連續步行節奏，再開始加入步數，並過濾單次震動、快速搖晃及相隔太耐的動作。請將手機放入口袋或穩定握持。</p></div></section></main>
<div id="modal" class="modal"><div class="dialog"><div class="blue">個人設定</div><h2>計步設定</h2><label>每日目標</label><input id="goalInput" type="number" min="1000" max="100000" step="500"><label>感應靈敏度</label><select id="sensitivity"><option value="low">低：較少誤計</option><option value="normal">正常：建議設定</option><option value="high">高：較易偵測輕步</option></select><div class="actions"><button id="cancel" class="cancel">取消</button><button id="save" class="save">儲存</button></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='stepflow-smart-v3',today=new Date().toISOString().slice(0,10);let s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let steps=s.date===today&&Number.isFinite(+s.steps)?+s.steps:0,goal=+s.goal||10000,sens=s.sens||'normal',tracking=false;
let week=s.date===today&&Array.isArray(s.week)?s.week:[0,0,0,0,0,0,0];let gravity={x:0,y:0,z:0},lastMag=0,lastCandidate=0,candidates=[],confirmed=false;
const $=x=>document.getElementById(x),fmt=x=>Math.round(x).toLocaleString('zh-HK');
const cfg=()=>sens==='low'?{t:2.25,mn:360,mx:1050,shake:7.2}:sens==='high'?{t:1.35,mn:280,mx:1250,shake:9.2}:{t:1.75,mn:320,mx:1150,shake:8.2};
function store(){localStorage.setItem(KEY,JSON.stringify({steps,goal,sens,week,date:today}))}function toast(t){$('toast').textContent='✓ '+t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2100)}
function render(){let p=Math.min(100,Math.round(steps/goal*100));$('steps').textContent=fmt(steps);$('goalText').textContent=fmt(goal);$('pct').textContent=p+'% 完成';$('ring').style.setProperty('--p',p+'%');$('remain').innerHTML=steps>=goal?'🏆 <b style="color:#059669">今日目標已達成！</b>':'再走 <b>'+fmt(goal-steps)+'</b> 步便達標';$('distance').textContent=(steps*.00078).toFixed(2);$('calories').textContent=fmt(steps*.04);$('minutes').textContent=fmt(steps/105);bars();store()}
function bars(){let d=[...week];d[6]=steps;let max=Math.max(...d,goal,1),ds=['一','二','三','四','五','六','日'];$('bars').innerHTML=d.map((v,i)=>'<div class="bi" title="'+fmt(v)+' 步"><div class="fill" style="height:'+Math.max(2,v/max*88)+'%"></div><div class="day">'+ds[i]+'</div></div>').join('')}
function clearRhythm(){candidates=[];confirmed=false}
function motion(e){let a=e.acceleration,mag;if(a&&a.x!=null){mag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z)}else{a=e.accelerationIncludingGravity;if(!a||a.x==null)return;gravity.x=.82*gravity.x+.18*a.x;gravity.y=.82*gravity.y+.18*a.y;gravity.z=.82*gravity.z+.18*a.z;let x=a.x-gravity.x,y=a.y-gravity.y,z=a.z-gravity.z;mag=Math.sqrt(x*x+y*y+z*z)}let now=Date.now(),c=cfg();if(mag>c.shake){clearRhythm();lastMag=mag;return}let peak=mag>c.t&&lastMag<=c.t;if(peak){let gap=now-lastCandidate;if(lastCandidate&&gap>=c.mn&&gap<=c.mx){candidates.push(now);candidates=candidates.filter(t=>now-t<2600);if(!confirmed&&candidates.length>=3){confirmed=true;steps+=3;render()}else if(confirmed){steps++;render()}}else if(!lastCandidate||gap>c.mx){clearRhythm();candidates=[now]}lastCandidate=now}if(confirmed&&now-lastCandidate>1600)clearRhythm();lastMag=mag}
async function toggle(){if(tracking){tracking=false;window.removeEventListener('devicemotion',motion);clearRhythm();$('track').textContent='▶ 啟用動作感應並開始';$('track').classList.remove('stop');$('status').textContent='📱 已暫停追蹤';return}try{if(typeof DeviceMotionEvent==='undefined'){toast('此瀏覽器不支援動作感應');return}if(typeof DeviceMotionEvent.requestPermission==='function'&&await DeviceMotionEvent.requestPermission()!=='granted'){toast('未獲動作感應權限');return}tracking=true;window.addEventListener('devicemotion',motion);$('track').textContent='■ 暫停追蹤';$('track').classList.add('stop');$('status').textContent='📱 正在確認自然步行節奏';toast('智能計步已開始')}catch(e){toast('感應器啟動失敗')}}
$('track').onclick=toggle;document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{steps=Math.max(0,steps+(+b.dataset.add));render()});$('reset').onclick=()=>{steps=0;if(tracking)toggle();render();toast('今日記錄已重設')};$('settings').onclick=()=>{$('goalInput').value=goal;$('sensitivity').value=sens;$('modal').classList.add('open')};$('cancel').onclick=()=> $('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('save').onclick=()=>{goal=Math.min(100000,Math.max(1000,+$('goalInput').value||10000));sens=$('sensitivity').value;$('modal').classList.remove('open');render();toast('設定已更新')};$('date').textContent=new Intl.DateTimeFormat('zh-HK',{month:'long',day:'numeric',weekday:'long'}).format(new Date());render();
</script></body></html>
